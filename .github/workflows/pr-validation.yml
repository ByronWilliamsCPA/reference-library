# PR Validation - Dependency & Standards Validation
# Inline replacement for the removed python-pr-validation.yml reusable workflow.
# Checks lock-file integrity and scans for known dependency vulnerabilities.
name: PR Validation

"on":
  pull_request:
    branches:
      - main
      - master
      - develop
  # merge_group: GitHub merge queues fire this event, not pull_request, so the
  # required "Dependency & Standards Validation" context must trigger on it or
  # the queue stalls waiting for a status that never reports.
  merge_group:

concurrency:
  # Cancel superseded runs; the required-check result comes from the newest
  # commit anyway, so stale runs only burn minutes.
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Verify lock file is up to date
        run: uv lock --check

      - name: Install dependencies from lockfile
        run: uv sync --all-extras --frozen

      - name: Check for known vulnerabilities
        run: uv run --frozen pip-audit
